name: Lint

on:
  push:
    branches:
      - main
  pull_request: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup dotNet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      # The solution holds the SDK, the three workload identity providers and
      # their test projects; every one of them is linted.
      - name: Restore
        run: dotnet restore WorkOS.net.sln
      - name: Verify formatting
        run: |
          for project in src/*/*.csproj test/*/*.csproj; do
            dotnet format "$project" --no-restore --verify-no-changes --severity warn
          done
      - name: Verify analyzers
        run: |
          for project in src/*/*.csproj test/*/*.csproj; do
            dotnet build -c Release "$project" --no-restore
          done
